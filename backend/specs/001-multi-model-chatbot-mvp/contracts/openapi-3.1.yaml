openapi: 3.1.0
info:
  title: Multi-Model Chatbot MVP API
  version: 1.0.0
  description: |
    Public and admin API for the MVP. Public endpoints serve end users;
    admin endpoints under `/v1/admin` require an admin JWT. SSE streaming
    is documented under the chat endpoint.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://{host}
    description: Production
    variables:
      host:
        default: api.example.com

tags:
  - name: auth
    description: Identity endpoints (public)
  - name: user
    description: End-user chat and history endpoints
  - name: admin
    description: Admin-only configuration endpoints
  - name: health
    description: Liveness and readiness

paths:
  /v1/chat/stream:
    post:
      operationId: ChatController_stream
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequestDto"
      responses:
        "201":
          description: ""
  /v1/conversations:
    get:
      operationId: ConversationsController_list
      parameters:
        - name: limit
          required: true
          in: query
          schema:
            type: string
        - name: offset
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
  /v1/conversations/{id}:
    get:
      operationId: ConversationsController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
    delete:
      operationId: ConversationsController_delete
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
  /v1/conversations/{id}/pin:
    patch:
      operationId: ConversationsController_pin
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinConversationDto"
      responses:
        "200":
          description: ""
  /v1/models:
    get:
      operationId: ModelsPublicController_list
      parameters: []
      responses:
        "200":
          description: ""
  /v1/admin/models:
    get:
      operationId: ModelsAdminController_list
      parameters: []
      responses:
        "200":
          description: ""
    post:
      operationId: ModelsAdminController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpsertDto"
      responses:
        "201":
          description: ""
  /v1/admin/models/{id}:
    patch:
      operationId: ModelsAdminController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpsertDto"
      responses:
        "200":
          description: ""
    delete:
      operationId: ModelsAdminController_delete
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: migrateTo
          required: false
          in: query
          description: Optional replacement model id. When present, all references to the
            deleted model (conversations, user sticky picks, app default) are
            re-pointed to it inside one verified transaction before deletion.
          schema:
            type: string
      responses:
        "200":
          description: ""
  /v1/files/upload:
    post:
      operationId: FilesController_upload
      parameters: []
      responses:
        "201":
          description: ""
  /v1/auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestDto"
      responses:
        "201":
          description: ""
  /v1/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDto"
      responses:
        "200":
          description: ""
  /v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequestDto"
      responses:
        "200":
          description: ""
  /v1/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        "204":
          description: ""
  /v1/admin/auth/login:
    post:
      operationId: AdminAuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDto"
      responses:
        "200":
          description: ""
  /v1/users/me:
    get:
      operationId: UsersController_me
      parameters: []
      responses:
        "200":
          description: ""
    patch:
      operationId: UsersController_updateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequestDto"
      responses:
        "200":
          description: ""
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is alive

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe (checks DB connectivity)
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new end-user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Authenticate and receive tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials (no email enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new access + refresh pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New tokens issued; old refresh token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the caller's refresh token
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/models:
    get:
      tags: [user]
      summary: List enabled models (display names only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of enabled models
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/conversations:
    get:
      tags: [user]
      summary: List the caller's conversations (most recent activity first)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Conversations list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/conversations/{id}:
    get:
      tags: [user]
      summary: Get a single conversation with its full transcript
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Conversation belongs to a different user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [user]
      summary: Delete a conversation (cascades messages)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/chat/stream:
    post:
      tags: [user]
      summary: Stream a chat completion as Server-Sent Events
      description: |
        Send a user message and receive a streaming chat completion.
        The response is a `text/event-stream`. Each event payload is a
        JSON object. The stream terminates with a final `event: done`
        on success or `event: error` on failure.

        **Active model resolution**: explicit `modelId` -> caller's sticky
        choice -> admin's default model. If no model is resolvable, the
        server returns 422 with `code = "no_model_available"`.

        **Disconnect resilience**: if the client disconnects mid-stream
        (browser closed, network dropped, navigation away, page refresh),
        the server keeps generating the assistant response to completion
        and persists the FULL response as a `role: "assistant"` message
        on the conversation. No `event: done` is delivered to the
        disconnected client (its socket is gone), but the server-side
        work runs to the end. The user can read the persisted message
        via `GET /v1/conversations/:id` after generation completes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE stream of model tokens
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"delta":"Hello"}

                  data: {"delta":" there"}

                  event: done
                  data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Central provider not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: No model resolvable (no admin default and no explicit selection)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/chat/{conversationId}/cancel:
    post:
      tags: [user]
      summary: Cancel the active generation for a conversation
      description: |
        Stops an in-progress streaming generation. The backend sets the
        streaming assistant message status to `cancelled` and preserves
        whatever content was accumulated. Returns the cancelled message id.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Generation cancelled
          content:
            application/json:
              schema:
                type: object
                required: [messageId, status]
                properties:
                  messageId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No active generation to cancel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/chat/{conversationId}/retry:
    post:
      tags: [user]
      summary: Retry a failed or cancelled generation
      description: |
        Creates a new assistant message with `status: streaming` and
        begins a fresh generation. The previous failed/cancelled message
        is retained in history. Requires the `failedMessageId` of the
        message to retry.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryRequest'
      responses:
        '200':
          description: New generation started
          content:
            application/json:
              schema:
                type: object
                required: [messageId, status]
                properties:
                  messageId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: streaming
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/admin/auth/login:
    post:
      tags: [admin]
      summary: Admin login (same endpoint contract as user login, but the issued JWT carries role=admin)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated as admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials or account not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/admin/provider:
    get:
      tags: [admin]
      summary: Get the central provider configuration (credential masked)
      security:
        - bearerAdminAuth: []
      responses:
        '200':
          description: Central provider config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CentralProviderPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Central provider not yet configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [admin]
      summary: Update the central provider configuration
      security:
        - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CentralProviderUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CentralProviderPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Probe failed; the prior configuration is preserved untouched.
            The response body `code` is one of:
            - `credentials_rejected` — the provider refused the API key (HTTP 401/403).
            - `provider_request_invalid` — the provider accepted auth but rejected the test request (HTTP 400/404 etc.).
            - `provider_unreachable` — the provider could not be reached or returned 5xx.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                credentials_rejected:
                  summary: API key rejected by the provider
                  value:
                    code: credentials_rejected
                    message: The AI provider rejected the credentials (HTTP 401).
                    requestId: 4c9ab911-b368-485c-8859-66a733478576
                provider_request_invalid:
                  summary: Auth OK but probe request was rejected
                  value:
                    code: provider_request_invalid
                    message: The AI provider rejected the probe request (HTTP 400). The credentials appear valid but the provider's response to a test request was unexpected. Confirm the base URL points at the provider you intend.
                    requestId: 4c9ab911-b368-485c-8859-66a733478576
                provider_unreachable:
                  summary: Provider could not be reached
                  value:
                    code: provider_unreachable
                    message: The AI provider could not be reached. Check the base URL and try again.
                    requestId: 4c9ab911-b368-485c-8859-66a733478576

  /v1/admin/models:
    get:
      tags: [admin]
      summary: List all models (including disabled)
      security:
        - bearerAdminAuth: []
      responses:
        '200':
          description: All models
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: Add a new model
      security:
        - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpsertRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Display name already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/admin/models/{id}:
    patch:
      tags: [admin]
      summary: Edit a model (display name, actual name, enabled)
      security:
        - bearerAdminAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpsertRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin]
      summary: Delete a model
      security:
        - bearerAdminAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Model is referenced by AppConfig or by existing conversations; reject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/admin/config:
    get:
      tags: [admin]
      summary: Get the AppConfig (default model id)
      security:
        - bearerAdminAuth: []
      responses:
        '200':
          description: App config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [admin]
      summary: Set (or clear) the default model
      description: |
        PUT with `{ "defaultModelId": "<uuid>" }` sets the default.
        PUT with `{ "defaultModelId": null }` clears the default.
        Referenced model MUST be enabled; otherwise 422.
      security:
        - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppConfigUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Referenced model is disabled or does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
    bearerAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT carrying role=admin

  parameters:
    PathId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    PathConversationId:
      in: path
      name: conversationId
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: invalid_credentials
        message:
          type: string
          example: The provided credentials were invalid.
        requestId:
          type: string
          format: uuid
          description: Echoed from the x-request-id header for support.

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user:
          $ref: '#/components/schemas/UserPublic'
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token TTL in seconds.

    UserPublic:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    ModelPublic:
      type: object
      required: [id, displayName, isDefault]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        isDefault:
          type: boolean

    ModelAdmin:
      allOf:
        - $ref: '#/components/schemas/ModelPublic'
        - type: object
          required: [actualName, enabled, createdAt, updatedAt]
          properties:
            actualName:
              type: string
            enabled:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ModelUpsertRequest:
      type: object
      required: [displayName, actualName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        actualName:
          type: string
          minLength: 1
          maxLength: 200
        enabled:
          type: boolean
          default: true

    CentralProviderPublic:
      type: object
      required: [baseUrl, isConfigured, lastValidatedAt]
      properties:
        baseUrl:
          type: string
          format: uri
        apiKeyMasked:
          type: string
          description: Last 4 characters of the credential prefixed with "***"
        isConfigured:
          type: boolean
        lastValidatedAt:
          type: string
          format: date-time
          nullable: true

    CentralProviderUpdateRequest:
      type: object
      required: [baseUrl, apiKey]
      properties:
        baseUrl:
          type: string
          format: uri
        apiKey:
          type: string
          minLength: 8

    AppConfigPublic:
      type: object
      required: [defaultModelId]
      properties:
        defaultModelId:
          type: string
          format: uuid
          nullable: true

    AppConfigUpdateRequest:
      type: object
      required: [defaultModelId]
      properties:
        defaultModelId:
          type:
            - string
            - "null"
          format: uuid
          nullable: true

    ConversationSummary:
      type: object
      required: [id, modelId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/ConversationSummary'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/MessagePublic'

    MessagePublic:
      type: object
      required: [id, role, content, createdAt, status]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, streaming, completed, failed, cancelled]
          description: |
            Current lifecycle status of the message.
            - `pending` — queued, not yet started.
            - `streaming` — assistant generation is in progress; content may be partial.
            - `completed` — generation finished successfully; content is final.
            - `failed` — generation ended with an error; content may be partial.
            - `cancelled` — user cancelled generation; content is whatever was accumulated.

    ChatRequest:
      type: object
      required: [message]
      properties:
        conversationId:
          type: string
          format: uuid
          description: |
            Optional. Omit to start a new conversation. If supplied, the
            conversation MUST belong to the caller; otherwise 403.
        modelId:
          type: string
          format: uuid
          description: |
            Optional. If omitted, the system uses the caller's sticky
            choice, then the admin default.
        message:
          type: string
          minLength: 1
          maxLength: 32000

    RetryRequest:
      type: object
      required: [failedMessageId]
      properties:
        failedMessageId:
          type: string
          format: uuid
          description: |
            The id of the previous failed or cancelled assistant message
            to retry. The old message is retained in conversation history.
