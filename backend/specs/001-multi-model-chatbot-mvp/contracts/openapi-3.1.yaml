components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    bearerAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT carrying role=admin
  parameters:
    PathId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    PathConversationId:
      in: path
      name: conversationId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not authorized for this resource or operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: invalid_credentials
        message:
          type: string
        requestId:
          type: string
          format: uuid
    RegisterRequest:
      type: object
      required:
      - username
      - email
      - password
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9_]{3,20}$
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      required:
      - identifier
      - password
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 128
          description: Email or username.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    AuthResponse:
      type: object
      required:
      - user
      - accessToken
      - refreshToken
      - expiresIn
      properties:
        user:
          $ref: '#/components/schemas/UserPublic'
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
    UserPublic: &id001
      type: object
      required:
      - id
      - email
      - username
      - displayName
      - avatarSeed
      - role
      - createdAt
      - lastLoginAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        avatarSeed:
          type:
          - string
          - 'null'
        role:
          type: string
          enum:
          - user
          - admin
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
    ModelPublic:
      type: object
      required:
      - id
      - displayName
      - isDefault
      - reasoning
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        isDefault:
          type: boolean
        reasoning:
          $ref: '#/components/schemas/ReasoningCapabilityPublic'
    ModelAdmin:
      type: object
      required:
      - id
      - displayName
      - actualName
      - providerId
      - visibility
      - enabled
      - inputPricePer1m
      - outputPricePer1m
      - isDefault
      - fallbackModelId
      - preferredApiKeyId
      - reasoning
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 80
        actualName:
          type: string
          maxLength: 200
        providerId:
          type: string
        visibility:
          type: string
          enum:
          - public
          - private
        enabled:
          type: boolean
        inputPricePer1m:
          type: number
          minimum: 0
        outputPricePer1m:
          type: number
          minimum: 0
        isDefault:
          type: boolean
        fallbackModelId:
          type:
          - string
          - 'null'
          format: uuid
        preferredApiKeyId:
          type:
          - string
          - 'null'
          format: uuid
        reasoning:
          $ref: '#/components/schemas/ReasoningAdminShape'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ModelUpsertRequest:
      type: object
      required:
      - displayName
      - actualName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        actualName:
          type: string
          minLength: 1
          maxLength: 200
        enabled:
          type: boolean
          default: true
    AppConfigPublic:
      type: object
      required:
      - defaultModelId
      properties:
        defaultModelId:
          type: string
          format: uuid
          nullable: true
    AppConfigUpdateRequest:
      type: object
      required:
      - defaultModelId
      properties:
        defaultModelId:
          type:
          - string
          - 'null'
          format: uuid
          nullable: true
    ConversationSummary:
      type: object
      required:
      - id
      - modelId
      - modelDisplayName
      - title
      - pinned
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
        modelDisplayName:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        pinned:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationDetail:
      allOf:
      - $ref: '#/components/schemas/ConversationSummary'
      - type: object
        required:
        - messages
        properties:
          messages:
            type: array
            items:
              $ref: '#/components/schemas/MessagePublic'
    MessagePublic:
      type: object
      required:
      - id
      - role
      - content
      - createdAt
      - status
      - citations
      - reasoningEnabled
      - reasoningSummary
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - streaming
          - completed
          - failed
          - cancelled
        citations:
          type: array
          items:
            $ref: '#/components/schemas/CitationSource'
        reasoningEnabled:
          type: boolean
        reasoningSummary:
          type:
          - string
          - 'null'
        file:
          oneOf:
          - $ref: '#/components/schemas/ConversationFile'
          - type: 'null'
    ChatRequest:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 32000
        conversationId:
          type:
          - string
          - 'null'
          format: uuid
        modelId:
          type:
          - string
          - 'null'
          format: uuid
        webSearch:
          type: boolean
        reasoning:
          type: boolean
        fileId:
          type: string
          format: uuid
    RetryRequest:
      type: object
      required:
