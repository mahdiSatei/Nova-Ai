openapi: 3.1.0
info:
  title: Multi-Model Chatbot MVP API
  version: 2.0.0
  description: |
    Public and admin API for the MVP. Public endpoints serve end users;
    admin endpoints under `/v1/admin` require an admin JWT. SSE streaming
    is documented under the chat endpoint.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://{host}
    description: Production
    variables:
      host:
        default: api.example.com

tags:
  - name: auth
    description: Identity endpoints (public)
  - name: user
    description: End-user chat and history endpoints
  - name: admin
    description: Admin-only configuration endpoints
  - name: health
    description: Liveness and readiness

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is alive

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe (checks DB connectivity)
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new end-user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Authenticate and receive tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials (no email enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new access + refresh pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New tokens issued; old refresh token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the caller's refresh token
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/models:
    get:
      tags: [user]
      summary: List the enabled models the caller is entitled to use
      description: |
        Returns every enabled model whose visibility the caller satisfies:
        `public` for any authenticated user and `private` for admins. Models the
        caller may not use are never returned. Spend is governed by the credit
        wallet, not by a per-user access tier.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of enabled models
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/conversations:
    get:
      tags: [user]
      summary: List the caller's conversations (most recent activity first)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Conversations list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/conversations/{id}:
    get:
      tags: [user]
      summary: Get a single conversation with its full transcript
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Conversation belongs to a different user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [user]
      summary: Delete a conversation (cascades messages)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/conversations/{id}/pin:
    patch:
      tags: [user]
      summary: Pin or unpin a conversation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinConversationDto'
      responses:
        '200':
          description: Conversation pin state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/conversations/{id}/model:
    patch:
      tags: [user]
      summary: Change the model used by a conversation
      description: |
        Updates `Conversation.modelId`. Future turns in this conversation
        use the new model. Existing message history is retained as-is.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetConversationModelRequest'
      responses:
        '200':
          description: Conversation model updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '400':
          description: Validation error (missing or malformed modelId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Model forbidden or conversation belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Model not available (unknown or disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/chat/stream:
    post:
      tags: [user]
      summary: Stream a chat completion as Server-Sent Events
      description: |
        Send a user message and receive a streaming chat completion over Server-Sent Events.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequestDto'
      responses:
        '200':
          description: Event stream established
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: No model available

  /v1/chat/{conversationId}/resume:
    post:
      tags: [user]
      summary: Resume a interrupted stream generation for a conversation
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stream generation resumed
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/chat/{conversationId}/cancel:
    post:
      tags: [user]
      summary: Cancel an ongoing generation for a conversation
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Generation canceled successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/chat/{conversationId}/retry:
    post:
      tags: [user]
      summary: Retry the last generation step in a conversation
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: New generation started
          content:
            application/json:
              schema:
                type: object
                required: [messageId, status]
                properties:
                  messageId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: streaming
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/users/me/model-preference:
    patch:
      tags: [user]
      summary: Set or clear the caller's preferred model
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelPreferenceRequest'
      responses:
        '200':
          description: Preference updated
          content:
            application/json:
              schema:
                type: object
                required: [modelId]
                properties:
                  modelId:
                    type: string
                    format: uuid
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Model not available

  /v1/admin/auth/login:
    post:
      tags: [admin]
      summary: Admin authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated as admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials or non-admin account

  /v1/admin/models:
    get:
      tags: [admin]
      summary: List all models (admin)
      security:
        - bearerAdminAuth: []
      responses:
        '200':
          description: Complete list of models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelAdmin'
    post:
      tags: [admin]
      summary: Create a model
      security:
        - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreateRequest'
      responses:
        '201':
          description: Model created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Display name conflict

  /v1/admin/models/{id}:
    patch:
      tags: [admin]
      summary: Edit a model
      security:
        - bearerAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPatchRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelAdmin'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin]
      summary: Delete a model
      security:
        - bearerAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: migrateTo
          in: query
          required: false
          description: Replacement model ID to re-point references before deletion.
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Model is referenced elsewhere and no migration ID was provided.