openapi: 3.1.0
info:
  title: Multi-Model Chatbot MVP API
  version: 2.0.0
  description: 'Public and admin API for the MVP. Public endpoints serve end users;

    admin endpoints under `/v1/admin` require an admin JWT. SSE streaming

    is documented under the chat endpoint.

    '
servers:
- url: http://localhost:3000
  description: Local development
- url: https://{host}
  description: Production
  variables:
    host:
      default: api.example.com
tags:
- name: auth
  description: Identity endpoints (public)
- name: user
  description: End-user profile, chat, history, models, files and payments
- name: admin
  description: Admin-only configuration and operational endpoints
- name: payments
  description: Credit purchases and payment status
- name: admin-payments
  description: Admin payment and purchase operations
- name: health
  description: Liveness and readiness
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is alive
  /readyz:
    get:
      tags:
      - health
      summary: Readiness probe (checks DB connectivity)
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/register:
    post:
      tags:
      - auth
      summary: Register a new end-user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Username or email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: Authenticate and receive tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials (no email/username enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Exchange a refresh token for a new access + refresh pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens issued; old refresh token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Invalidate the caller's refresh token
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/models:
    get:
      tags:
      - user
      summary: List the enabled models the caller is entitled to use
      description: 'Returns every enabled model whose visibility the caller satisfies:

        `public` for any authenticated user and `private` for admins. Models the

        caller may not use are never returned. Spend is governed by the credit

        wallet, not by a per-user access tier.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of enabled models
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/conversations:
    get:
      tags:
      - user
      summary: List the caller's conversations (most recent activity first)
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Conversations list
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/conversations/{id}:
    get:
      tags:
      - user
      summary: Get a single conversation with its full transcript
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Conversation belongs to a different user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - user
      summary: Delete a conversation (cascades messages)
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/chat/stream:
    post:
      tags:
      - user
      summary: Stream a chat completion as Server-Sent Events
      description: 'Send a user message and receive a streaming chat completion over Server-Sent Events.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Event stream established
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: No model available
  /v1/chat/{conversationId}/cancel:
    post:
      tags:
      - user
      summary: Cancel an ongoing generation for a conversation
      security:
      - bearerAuth: []
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Generation canceled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationCancelResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/chat/{conversationId}/retry:
    post:
      tags:
      - user
      summary: Retry the last generation step in a conversation
      security:
      - bearerAuth: []
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: SSE stream established for the retry
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryRequest'
  /v1/admin/auth/login:
    post:
      tags:
      - admin
      summary: Admin authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated as admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials or non-admin account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/models:
    get:
      tags:
      - admin
      summary: List all models (admin)
      security:
      - bearerAdminAuth: []
      responses:
        '200':
          description: Complete list of models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelAdminList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - admin
      summary: Create a model
      security:
      - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreateRequest'
      responses:
        '201':
          description: Model created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Display name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Provider or reasoning configuration is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/models/{id}:
    patch:
      tags:
      - admin
      summary: Edit a model
      security:
      - bearerAdminAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPatchRequest'
      responses:
        '200':
          description: Updated model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Model name/default/visibility conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Provider/reasoning configuration invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - admin
      summary: Delete a model
      security:
      - bearerAdminAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: migrateTo
        in: query
        required: false
        description: Replacement model id to re-point references before deletion.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted without migration
        '200':
          description: Deleted after migration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDeleteMigrationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Model is referenced elsewhere and no migration id was provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid replacement model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/config:
    get:
      tags:
      - admin
      summary: Get the AppConfig (default model id)
      security:
      - bearerAdminAuth: []
      responses:
        '200':
          description: App config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
      - admin
      summary: Set or clear the default model
      security:
      - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppConfigUpdateRequest'
      responses:
        '200':
          description: Updated config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Referenced model is missing, disabled, or not public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/conversations/{id}/pin:
    patch:
      tags:
      - user
      summary: Pin or unpin a conversation
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinConversationDto'
      responses:
        '200':
          description: Conversation pin state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPinResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/conversations/{id}/model:
    patch:
      tags:
      - user
      summary: Change the model used by a conversation
      description: 'Updates `Conversation.modelId`. Future turns in this conversation

        use the new model. Existing message history is retained as-is.

        '
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetConversationModelRequest'
      responses:
        '200':
          description: Conversation model updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '400':
          description: Validation error (missing or malformed modelId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Model forbidden or conversation belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Model not available (unknown or disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/chat/{conversationId}/resume:
    post:
      tags:
      - user
      summary: Resume a interrupted stream generation for a conversation
      security:
      - bearerAuth: []
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: SSE stream resumed
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/users/me/model-preference:
    patch:
      tags:
      - user
      summary: Set or clear the caller's preferred model
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelPreferenceRequest'
      responses:
        '200':
          description: Preference updated
          content:
            application/json:
              schema:
                type: object
                required:
                - modelId
                properties:
                  modelId:
                    type: string
                    format: uuid
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Model not available
  /v1/credit-purchases:
    post:
      tags:
      - payments
      summary: Start a credit purchase
      description: 'Creates a CreditPurchase and a provider payment attempt, then returns the URL the browser must be sent
        to. Credits are priced with the deployment''s CREDIT_PRICE_TOMAN.

        '
      operationId: createCreditPurchase
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - credits
              properties:
                credits:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                  example: 100
      responses:
        '201':
          description: Purchase created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePurchaseResult'
        '400':
          description: Invalid credit amount, or the purchase exceeds the amount ceiling
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 'Payments are not configured on this deployment (`payment_not_configured`) or the provider is unavailable
            (`payment_provider_unavailable`)

            '
  /v1/payments:
    get:
      tags:
      - payments
      summary: List the caller's payments
      operationId: listMyPayments
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - SUCCESS
          - FAILED
          - CANCELLED
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Paginated payments belonging to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPayments'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/payments/zibal/callback:
    get:
      tags:
      - payments
      summary: Zibal browser callback
      description: 'Public. Verifies the transaction with the provider and redirects the browser to the configured result
        page with `paymentId` and `status` (`success`, `failed`, `cancelled`, `pending`, `not_found`). `pending` means the
        provider could not be reached, so the payment is still open. The `success` query parameter is NOT trusted; only the
        server-to-server verify decides the outcome.

        '
      operationId: zibalCallback
      security: []
      parameters:
      - name: trackId
        in: query
        required: true
        schema:
          type: string
      - name: success
        in: query
        description: Informational only.
        schema:
          type: string
          enum:
          - '0'
          - '1'
      responses:
        '302':
          description: Redirect to the configured PAYMENT_RESULT_REDIRECT_URL
  /v1/payments/{id}:
    get:
      tags:
      - payments
      summary: Read one of the caller's payments
      operationId: getMyPayment
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentView'
        '404':
          description: Not found (also returned for another user's payment)
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/payments:
    get:
      tags:
      - admin-payments
      summary: List payments
      operationId: adminListPayments
      security:
      - bearerAdminAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - SUCCESS
          - FAILED
          - CANCELLED
      - name: userId
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Paginated payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPayments'
        '403':
          description: Admin role required
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/credit-purchases:
    get:
      tags:
      - admin-payments
      summary: List credit purchases
      operationId: adminListCreditPurchases
      security:
      - bearerAdminAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - COMPLETED
          - FAILED
          - CANCELLED
      - name: userId
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Paginated credit purchases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreditPurchases'
        '403':
          description: Admin role required
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/payments/{id}/reconcile:
    post:
      tags:
      - admin-payments
      summary: Re-verify a pending payment with the provider
      description: 'Recovery path for a payment left PENDING by a provider outage during the browser callback. Idempotent:
        a payment that is already terminal is returned unchanged.

        '
      operationId: adminReconcilePayment
      security:
      - bearerAdminAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The payment after reconciliation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentView'
        '403':
          description: Admin role required
        '404':
          description: Payment not found
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/users/me:
    get:
      tags:
      - user
      summary: Get the caller's profile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - user
      summary: Update the caller's profile
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/users:
    get:
      tags:
      - admin
      summary: List users (admin)
      security:
      - bearerAdminAuth: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Paginated admin user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
